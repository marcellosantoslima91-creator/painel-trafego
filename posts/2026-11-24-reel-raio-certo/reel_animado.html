<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{background:#FFF3E3;font-family:'Poppins',sans-serif;color:#2B1A12;position:relative}
.blob{position:absolute;border-radius:50%}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
.abs{position:absolute}
.kicker{font-family:'Inter';font-weight:700;font-size:34px;letter-spacing:6px;text-transform:uppercase;color:#FF6B2C}
.big{font-weight:800;font-size:96px;line-height:1.03;letter-spacing:-3px}
.mid{font-weight:800;font-size:80px;line-height:1.05;letter-spacing:-2px}
.body{font-family:'Inter';font-weight:500;font-size:42px;line-height:1.35;color:#5A4236}
.hl{color:#FF6B2C}
.line{display:block;overflow:hidden}
.line>span{display:inline-block}
.top{position:absolute;top:0;left:0;height:16px;background:#FF6B2C}
.brand{position:absolute;left:90px;right:90px;bottom:330px;display:flex;justify-content:space-between;font-family:'Inter';font-weight:600;font-size:30px;color:#8A6E5E}
.brand b{color:#2B1A12}
.card{background:#fff;border-radius:36px;box-shadow:0 24px 60px rgba(43,26,18,.12)}
.cta{display:inline-block;background:#FF6B2C;color:#fff;font-weight:800;font-size:56px;padding:34px 60px;border-radius:24px;box-shadow:0 18px 40px rgba(255,107,44,.35)}
.row{display:flex;align-items:center;height:104px;border-top:2px solid #F1E2D2;font-family:Inter;font-weight:600;font-size:36px}
.row .lab{flex:1;padding-left:36px}
.row .c{width:200px;text-align:center;font-weight:800;font-size:52px}
.no{color:#E5484D}.yes{color:#1F9D55}
</style></head>
<body>
<div id="b1" class="blob" style="width:760px;height:760px;background:#FFD8B8;left:-260px;top:120px"></div>
<div id="b2" class="blob" style="width:620px;height:620px;background:#FFE6C9;right:-220px;top:1080px"></div>
<div id="bar" class="top"></div>

<!-- CENA 1 -->
<div class="scene" id="s1">
  <div class="abs" style="left:90px;top:270px;width:900px">
    <div class="kicker" id="s1k"></div>
    <div class="big" style="margin-top:28px">
      <span class="line"><span id="s1l1"></span></span>
      <span class="line"><span id="s1l2" class="hl"></span></span>
      <span class="line"><span id="s1l3"></span></span>
    </div>
  </div>
  <div id="phone" class="abs card" style="left:240px;top:850px;width:600px;height:500px;border-radius:48px;overflow:hidden">
    <div style="height:320px;background:linear-gradient(135deg,#FFD8B8,#FFB48C);display:flex;align-items:center;justify-content:center;font-size:170px" id="emo"></div>
    <div style="padding:26px 34px;font-family:Inter;font-weight:600;font-size:30px;color:#8A6E5E" id="cardcap"></div>
  </div>
  <div id="chip" class="abs" style="left:300px;top:1300px;min-width:480px;padding:28px 40px;border-radius:24px;background:#2B1A12;color:#FFF3E3;font-family:Inter;font-weight:800;font-size:40px;text-align:center"></div>
  <div id="ripple" class="abs" style="left:510px;top:1310px;width:60px;height:60px;border-radius:50%;border:6px solid #FF6B2C"></div>
</div>
<!-- CENA 2 -->
<div class="scene" id="s2">
  <div id="mito" class="abs" style="left:120px;top:420px;width:840px;height:300px;border:16px solid #E5484D;border-radius:40px;color:#E5484D;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:170px;letter-spacing:2px"></div>
  <div class="abs" style="left:90px;top:860px;width:900px">
    <div class="mid"><span class="line"><span id="s2t1"></span></span><span class="line"><span id="s2t2"></span></span></div>
    <div class="body" style="margin-top:36px" id="s2b"></div>
  </div>
</div>
<!-- CENA 3 -->
<div class="scene" id="s3">
  <div class="abs" style="left:90px;top:270px;width:900px">
    <div class="kicker" id="s3k"></div>
    <div class="mid" style="margin-top:20px"><span class="line"><span id="s3t1"></span></span><span class="line"><span id="s3t2" class="hl"></span></span></div>
  </div>
  <div id="table" class="abs card" style="left:90px;top:720px;width:900px;overflow:hidden">
    <div style="display:flex;height:110px;align-items:center;font-family:Inter;font-weight:800;font-size:28px;color:#8A6E5E">
      <div style="flex:1;padding-left:36px"></div><div style="width:200px;text-align:center" id="ca"></div><div style="width:200px;text-align:center;color:#FF6B2C" id="cb"></div>
    </div>
    <div id="rows"></div>
  </div>
</div>
<!-- CENA 4 -->
<div class="scene" id="s4">
  <div class="abs" style="left:90px;top:270px;width:900px">
    <div class="kicker" id="s4k"></div>
    <div class="mid" style="margin-top:20px"><span class="line"><span id="s4t1"></span></span><span class="line"><span id="s4t2"></span></span></div>
  </div>
  <div id="statA" class="abs card" style="left:90px;top:720px;width:900px;height:260px;display:flex;align-items:center;gap:36px;padding:0 50px">
    <div style="font-size:110px" id="aemo"></div>
    <div><div style="font-weight:800;font-size:120px;line-height:1"><span id="cnt">0</span><span id="asuf" style="font-size:70px"></span></div><div style="font-family:Inter;font-weight:600;font-size:34px;color:#8A6E5E" id="alab"></div></div>
  </div>
  <svg id="arrow" class="abs" style="left:500px;top:995px" width="80" height="90" viewBox="0 0 80 90"><path d="M40 0 V70 M12 46 L40 76 L68 46" fill="none" stroke="#FF6B2C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div id="statB" class="abs card" style="left:90px;top:1100px;width:900px;height:220px;display:flex;align-items:center;gap:36px;padding:0 50px;outline-offset:-8px">
    <div style="font-size:100px" id="bemo"></div>
    <div><div style="font-weight:800;font-size:90px;line-height:1;white-space:nowrap" id="btxt"></div><div style="font-family:Inter;font-weight:600;font-size:34px;color:#8A6E5E" id="blab"></div></div>
  </div>
  <div class="abs body" style="left:90px;top:1370px;width:900px" id="s4b"></div>
</div>
<!-- CENA 5 -->
<div class="scene" id="s5">
  <div class="abs" style="left:90px;top:290px;width:900px">
    <div class="kicker" id="s5k"></div>
    <div class="big" style="margin-top:28px"><span class="line"><span id="s5l1"></span></span><span class="line"><span id="s5l2" class="hl"></span></span></div>
  </div>
  <div id="bubble" class="abs" style="left:90px;top:800px;width:900px">
    <div style="display:flex;gap:24px;align-items:center">
      <div style="width:110px;height:110px;border-radius:50%;background:#2B1A12;color:#FFF3E3;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:44px">K</div>
      <div class="card" style="padding:34px 44px;font-family:Inter;font-weight:600;font-size:44px;border-bottom-left-radius:8px">Comente <b id="typed" style="color:#FF6B2C;font-family:Poppins;font-weight:800"></b></div>
    </div>
  </div>
  <div id="ctabtn" class="abs" style="left:90px;top:1060px"><span class="cta">Falar com a KMD →</span></div>
  <div class="abs body" style="left:90px;top:1300px;width:900px" id="s5b"></div>
</div>

<div class="brand"><b>KMD Mídias Digitais</b><span>@kmdmidias</span></div>

<script>
const D = 20.0;
const S = [[0,3.6],[3.6,7.2],[7.2,11.6],[11.6,15.6],[15.6,20.0]];
const cl = (v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const p = (t,a,d)=>cl((t-a)/d);
const eOut = x=>1-Math.pow(1-x,3);
const eBack = x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const $ = id=>document.getElementById(id);

const CFG = {"s1k": "Mito ou verdade?", "s1l1": "“Quanto mais", "s1l2": "longe chegar,", "s1l3": "melhor.”", "emo": "📍", "cardcap": "O seu negócio", "chip": "Raio: 50 km", "stamp": "MITO", "s2t1": "Ninguém atravessa", "s2t2": "o distrito <span class=hl>por um café</span>.", "s2b": "Num negócio local, o cliente está perto. Anunciar longe é pagar a quem <b style='color:#2B1A12'>nunca vai aparecer</b>.", "s3k": "O que muda", "s3t1": "Raio de 50 km", "s3t2": "vs raio de 5 km", "ca": "50 KM", "cb": "5 KM", "rows": [["Quem vê pode mesmo vir", "✕", "✓"], ["Orçamento concentrado", "✕", "✓"], ["Mensagens da sua zona", "✕", "✓"], ["Chega a quem importa", "✕", "✓"]], "s4k": "Regra para começar", "s4t1": "Comece pequeno,", "s4t2": "alargue depois", "aemo": "🗺️", "anum": 50, "asuf": " km", "alab": "espalha o orçamento por quem não vem", "bemo": "🎯", "btxt": "3 a 5 km", "blab": "onde estão os seus clientes", "bGood": true, "s4b": "Alargue o raio <b style='color:#2B1A12'>só se faltar alcance.</b>", "s5k": "Não sabe que raio usar?", "s5l1": "Anuncie onde", "s5l2": "o cliente está.", "kw": "RAIO", "s5b": "🔁 Envie a um dono de negócio local.", "capaK": "Mito ou verdade?", "capaT": "“Quanto mais<br>longe, <span class=hl>melhor</span>.”", "capaBtn": "Veja o raio certo ▶"};
function T(id,v){ $(id).innerHTML=v; }
(function(){
  const c=CFG; ['s1k','s1l1','s1l2','s1l3','s2t1','s2t2','s2b','s3k','s3t1','s3t2','s4k','s4t1','s4t2','s4b','s5k','s5l1','s5l2','s5b'].forEach(k=>T(k,c[k]||''));
  T('emo',c.emo); T('cardcap',c.cardcap); T('chip',c.chip);
  T('mito',c.stamp); const sc=c.stampColor||'#E5484D'; $('mito').style.borderColor=sc; $('mito').style.color=sc;
  T('ca',c.ca); T('cb',c.cb);
  $('rows').innerHTML=c.rows.map((r,i)=>`<div class="row"><div class="lab">${r[0]}</div><div class="c ${r[1]=='✓'?'yes':'no'}" id="r${i+1}a">${r[1]}</div><div class="c ${r[2]=='✓'?'yes':'no'}" id="r${i+1}b">${r[2]}</div></div>`).join('');
  T('aemo',c.aemo); T('asuf',c.asuf||''); T('alab',c.alab); T('bemo',c.bemo); T('btxt',c.btxt); T('blab',c.blab);
  const bc=c.bGood?'#1F9D55':'#E5484D'; $('btxt').style.color=bc; $('statB').style.outline='8px solid '+bc;
})();
function tf(el, {x=0,y=0,s=1,r=0,o=1}){ el.style.transform=`translate(${x}px,${y}px) scale(${s}) rotate(${r}deg)`; el.style.opacity=o; }
function rise(id, lt, a, d=0.4){ const k=eOut(p(lt,a,d)); tf($(id),{y:(1-k)*120,o:k}); }
function pop(id, lt, a, d=0.5, r0=0){ const k=p(lt,a,d); const e=eBack(k); tf($(id),{s:k===0?0.001:e, r:(1-e)*r0, o:cl(k*3)}); }
function setTime(t){
  $('bar').style.width = (t/D*1080)+'px';
  tf($('b1'),{x:Math.sin(t*0.6)*40,y:Math.cos(t*0.5)*30});
  tf($('b2'),{x:Math.cos(t*0.5)*40,y:Math.sin(t*0.7)*30});
  S.forEach(([a,b],i)=>{
    const el=$('s'+(i+1)); const e=i===0?1:eOut(p(t,a-0.2,0.35)); const x=(i<4)?eOut(p(t,b-0.22,0.22)):0;
    const vis=(t>=a-0.201)&&(t<=b+0.001);
    el.style.opacity=vis? e*(1-x):0; el.style.transform=`translateY(${(1-e)*60 - x*80}px)`;
  });
  let lt;
  // cena 1
  lt=t;
  rise('s1k',lt,0.05,0.35); rise('s1l1',lt,0.12,0.35); rise('s1l2',lt,0.22,0.35); rise('s1l3',lt,0.32,0.35);
  rise('phone',lt,0.6,0.5);
  pop('chip',lt,1.95,0.4);
  { const k=p(lt,2.0,0.5); tf($('ripple'),{s:k===0?0.001:1+k*6,o:k===0?0:(1-k)}); }
  // cena 2
  lt=t-S[1][0]+0.25;
  { const k=p(lt,0.1,0.35); tf($('mito'),{s:k===0?0.001:(1+(1-eOut(k))*1.6), r:-6, o:cl(k*3)}); }
  rise('s2t1',lt,0.7); rise('s2t2',lt,0.82); rise('s2b',lt,1.3);
  // cena 3
  lt=t-S[2][0]+0.25;
  rise('s3k',lt,0.05); rise('s3t1',lt,0.15); rise('s3t2',lt,0.27);
  rise('table',lt,0.6,0.45);
  [1,2,3,4].forEach((r,i)=>{ const a=1.2+i*0.55; pop('r'+r+'a',lt,a,0.35); pop('r'+r+'b',lt,a+0.22,0.35); });
  // cena 4
  lt=t-S[3][0]+0.25;
  rise('s4k',lt,0.05); rise('s4t1',lt,0.15); rise('s4t2',lt,0.27);
  rise('statA',lt,0.6,0.4);
  $('cnt').textContent = Math.round(CFG.anum*eOut(p(lt,0.8,1.2)));
  { const k=p(lt,2.1,0.35); tf($('arrow'),{y:(1-eOut(k))*-40,o:k}); }
  pop('statB',lt,2.4,0.5,4);
  rise('s4b',lt,2.9);
  // cena 5
  lt=t-S[4][0]+0.25;
  rise('s5k',lt,0.2); rise('s5l1',lt,0.35); rise('s5l2',lt,0.5);
  { const k=p(lt,0.9,0.5); tf($('bubble'),{x:(1-eOut(k))*-200,o:k}); }
  { const full='“'+CFG.kw+'”'; const n=Math.round(cl((lt-1.3)/0.7)*full.length); $('typed').textContent = full.slice(0,Math.max(1,n)); }
  { const k=p(lt,2.1,0.5); const pulse = lt>2.6 ? 1+0.04*Math.sin((lt-2.6)*6) : 1; tf($('ctabtn'),{s:(k===0?0.001:eBack(k))*pulse,o:cl(k*3)}); }
  rise('s5b',lt,2.7);
}
setTime(0);
</script>
</body></html>
